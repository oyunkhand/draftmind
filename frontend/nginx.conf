server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API is served by the backend container on the compose network
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  # SPA routing
  location / {
    try_files $uri /index.html;
  }
}
