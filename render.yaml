# Render Blueprint — backend API (Docker). Frontend goes to Vercel/Netlify (see README).
services:
  - type: web
    name: draftmind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATA_SOURCE
        value: auto
      - key: CORS_ORIGINS
        value: "*"
      - key: GRID_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
