# Render Blueprint — DraftMind (API + built UI in one Docker service, one origin).
# The whole site is behind HTTP Basic auth (DEMO_USER / DEMO_PASSWORD): Render generates the password;
# read it in the dashboard (Environment tab) and put it in the Devpost testing instructions for judges.
services:
  - type: web
    name: draftmind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATA_SOURCE
        value: auto
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_USER
        value: judge
      - key: DEMO_PASSWORD
        generateValue: true
      # 1 = build with the official GRID hackathon data (licensed: judges-only demo behind DEMO_PASSWORD;
      # hosting it this way was confirmed with the organizers). Set back to 0 / delete after judging.
      - key: GRID_DATA
        value: "1"
      - key: GRID_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
